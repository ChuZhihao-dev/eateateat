<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>今天吃什么</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar-lead">
        <div class="appbar-title" id="appbar-title">今天吃什么</div>
        <div class="appbar-sub" id="appbar-sub"></div>
      </div>
      <div class="appbar-actions" id="appbar-actions"></div>
    </header>

    <div class="ptr" id="ptr">
      <div class="ptr-spinner"></div>
      <span id="ptr-text">下拉刷新</span>
    </div>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab on" data-tab="recommend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M4.2 7.2l2.1 2.1M17.7 14.7l2.1 2.1M3 12h3M18 12h3M4.2 16.8l2.1-2.1M17.7 9.3l2.1-2.1"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
        <span>推荐</span>
      </button>
      <button class="tab" data-tab="dishes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
          <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/>
        </svg>
        <span>菜品库</span>
      </button>
      <button class="tab" data-tab="records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3.5 10h17"/>
          <path d="M8 14h3M8 17.5h6"/>
        </svg>
        <span>记录</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V10M10 20V4M16 20v-7M20 20H4"/>
        </svg>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <div id="sheet" class="sheet-mask hidden">
    <div class="sheet" id="sheet-panel">
      <div class="sheet-grab" id="sheet-grab"><span></span></div>
      <div class="sheet-head">
        <h3 id="sheet-title">编辑菜品</h3>
        <button class="icon-btn" id="sheet-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
